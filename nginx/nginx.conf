events {}

http {
    # Round-robin за замовчуванням. Жодних ip_hash / hash $cookie / sticky —
    # будь-який запит може потрапити на будь-який instance.
    upstream company_api {
        server companies-service-1:5001 max_fails=1 fail_timeout=5s;
        server companies-service-2:5001 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://company_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Якщо instance впав — повторити запит на іншому
            # (nginx не повторює non-idempotent запити, які вже були відправлені апстриму).
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # X-Instance-ID приходить від самого застосунку; X-Upstream — для налагодження
            add_header X-Upstream $upstream_addr always;
        }
    }
}
