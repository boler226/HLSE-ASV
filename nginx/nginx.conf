worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # upstream_addr містить кілька адрес, якщо був retry/failover на інший вузол
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'rt=$request_time urt=$upstream_response_time '
                  'upstream=$upstream_addr inst=$upstream_http_x_instance_id';

    access_log /dev/stdout lb;
    error_log  /dev/stderr warn;

    # Алгоритм балансування (upstream company_backend) підключається окремим файлом:
    # nginx/upstreams/<LB_ALGO>.conf  ->  /etc/nginx/upstream.conf
    include /etc/nginx/upstream.conf;

    server {
        listen 80;

        # Стан самого балансувальника (не проксіюється)
        location = /lb-status {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://company_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";           # потрібно для keepalive до upstream
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # --- Fault tolerance (passive health check) ---
            proxy_connect_timeout 1s;                 # мертвий вузол виявляємо швидко
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
            proxy_next_upstream         error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries   3;
            proxy_next_upstream_timeout 5s;
        }
    }
}