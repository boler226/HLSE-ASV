# IP Hash: один клієнтський IP завжди потрапляє на один і той самий інстанс
upstream company_backend {
    ip_hash;
    server companies-service-1:5001 max_fails=2 fail_timeout=10s;
    server companies-service-2:5001 max_fails=2 fail_timeout=10s;
    server companies-service-3:5001 max_fails=2 fail_timeout=10s;
    keepalive 32;
}
