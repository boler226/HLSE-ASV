# Лаба №2: два однакових instances CompanyService + Redis + nginx (round-robin, без sticky sessions)

x-company-common: &company-common
  image: companies-service:lab2
  pull_policy: never               # образ локальний, не тягнемо з Docker Hub
  environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - ConnectionStrings__PostgreSQLConnection=Host=postgres;Port=5432;Database=UserService;Username=postgres;Password=boler2020
    - ConnectionStrings__Redis=redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000,asyncTimeout=1000
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - backend

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: UserService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: boler2020
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d UserService"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - backend

  users-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: users-service
    container_name: users-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSQLConnection=Host=postgres;Port=5432;Database=UserService;Username=postgres;Password=boler2020
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - backend

  # ---- Instance 1 (збирає образ) ----
  companies-service-1:
    <<: *company-common
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      target: companies-service
    container_name: companies-service-1
    hostname: company-1            # => X-Instance-ID: company-1
    ports:
      - "5011:5001"                # прямий доступ для детермінованих тестів

  # ---- Instance 2 (той самий образ) ----
  companies-service-2:
    <<: *company-common
    container_name: companies-service-2
    hostname: company-2            # => X-Instance-ID: company-2
    ports:
      - "5012:5001"

  # ---- Load balancer: round-robin, БЕЗ ip_hash / sticky cookies ----
  nginx:
    image: nginx:1.27-alpine
    container_name: company-lb
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - companies-service-1
      - companies-service-2
    networks:
      - backend

  notifications-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: notifications-worker
    container_name: notifications-worker
    restart: "no"
    environment:
      - ConnectionStrings__PostgreSQLConnection=Host=postgres;Port=5432;Database=UserService;Username=postgres;Password=boler2020
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      users-service:
        condition: service_started
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend: