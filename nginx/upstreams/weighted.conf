# Weighted Round Robin: симуляція гетерогенної інфраструктури (потужності 3 : 2 : 1)
upstream company_backend {
    server companies-service-1:5001 weight=3 max_fails=2 fail_timeout=10s;
    server companies-service-2:5001 weight=2 max_fails=2 fail_timeout=10s;
    server companies-service-3:5001 weight=1 max_fails=2 fail_timeout=10s;
    keepalive 32;
}
