# Лаба №3: горизонтальне масштабування + балансування навантаження
# Єдина точка входу: nginx (company-lb) на :8080. Інстанси CompanyService назовні НЕ публікуються.
#
# Керування через змінні середовища (Windows cmd: set NAME=value):
#   LB_ALGO   = round_robin | least_conn | weighted | ip_hash | scale_1 | scale_2   (за замовч. round_robin)
#   DELAY_1/2/3 = штучна затримка (мс) на конкретному інстансі                       (за замовч. 0)
#   COMPANY_CPUS = ліміт CPU на один інстанс                                         (за замовч. 1.0)

x-company-env: &company-env
  ASPNETCORE_ENVIRONMENT: "Development"
  ConnectionStrings__PostgreSQLConnection: "Host=postgres;Port=5432;Database=UserService;Username=postgres;Password=boler2020"
  ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000,asyncTimeout=1000"

x-company-common: &company-common
  image: companies-service:lab2
  pull_policy: never
  cpus: ${COMPANY_CPUS:-1.0}
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - backend

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: UserService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: boler2020
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d UserService"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - backend

  users-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: users-service
    container_name: users-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSQLConnection=Host=postgres;Port=5432;Database=UserService;Username=postgres;Password=boler2020
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - backend

  # ---- Пул backend-інстансів: БЕЗ ports => недоступні ззовні, лише через nginx ----
  companies-service-1:
    <<: *company-common
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      target: companies-service
    container_name: companies-service-1
    hostname: company-1
    environment:
      <<: *company-env
      ARTIFICIAL_DELAY_MS: "${DELAY_1:-0}"

  companies-service-2:
    <<: *company-common
    container_name: companies-service-2
    hostname: company-2
    environment:
      <<: *company-env
      ARTIFICIAL_DELAY_MS: "${DELAY_2:-0}"

  companies-service-3:
    <<: *company-common
    container_name: companies-service-3
    hostname: company-3
    environment:
      <<: *company-env
      ARTIFICIAL_DELAY_MS: "${DELAY_3:-0}"

  # ---- Load balancer: єдина зовнішня точка входу ----
  nginx:
    image: nginx:1.27-alpine
    container_name: company-lb
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstreams/${LB_ALGO:-round_robin}.conf:/etc/nginx/upstream.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - companies-service-1
      - companies-service-2
      - companies-service-3
    networks:
      - backend

  notifications-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: notifications-worker
    container_name: notifications-worker
    restart: "no"
    environment:
      - ConnectionStrings__PostgreSQLConnection=Host=postgres;Port=5432;Database=UserService;Username=postgres;Password=boler2020
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      users-service:
        condition: service_started
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend: